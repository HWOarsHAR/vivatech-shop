{% extends "base.html" %}
{% block title %}Обратная связь{% endblock %}
{% block content %}
<h1>Обратная связь / отзыв</h1>
{% if not current_user %}
  <div class="alert">Чтобы отправить сообщение, <a href="{% url 'login' %}?next=/feedback/">войдите</a> или <a href="{% url 'register' %}">зарегистрируйтесь</a>.</div>
{% else %}
<form class="form js-validate js-api" novalidate data-api="/api/feedback" data-method="POST" data-reset data-success="Спасибо! Сообщение отправлено.">
  <div class="field"><label for="subject">Тема *</label>
    <input id="subject" name="subject" required minlength="3" maxlength="200"><div class="error"></div></div>
  <div class="field"><label for="message">Сообщение * (минимум 10 символов)</label>
    <textarea id="message" name="message" rows="5" required minlength="10"></textarea><div class="error"></div></div>
  <div class="field"><label for="rating">Оценка (1–5, для отзыва)</label>
    <input id="rating" name="rating" type="number" min="1" max="5" step="1" data-msg="Оценка от 1 до 5"><div class="error"></div></div>
  {% include "_consent.html" with kind="pd" %}
  <div class="form-error"></div><div class="form-ok"></div>
  <button class="btn" type="submit">Отправить</button>
</form>
{% endif %}
{% endblock %}
