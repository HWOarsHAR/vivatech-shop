<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ doc.title }}</title>
<style>
body{font:16px/1.6 system-ui,"Segoe UI",sans-serif;max-width:860px;margin:0 auto;padding:1rem;color:#222}
h1{font-size:1.6rem;margin-bottom:.2rem}h2{font-size:1.15rem;margin:1.6rem 0 .4rem}.date{color:#666;margin-top:0}
.bar{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;padding:10px 14px;margin-bottom:1rem;background:#eef1f8;border-radius:10px;font-size:15px}
.bar a{color:#2447c9}p{margin:.4rem 0;text-align:justify}
</style></head>
<body>
{% if not download %}
<div class="bar">
  <a href="{% url 'index' %}">← На сайт</a>
  <span>Скачать:
    <a href="{% url 'legal_download' slug=doc.slug fmt='pdf' %}">PDF</a> ·
    <a href="{% url 'legal_download' slug=doc.slug fmt='txt' %}">TXT</a> ·
    <a href="{% url 'legal_download' slug=doc.slug fmt='odt' %}">ODT</a> ·
    <a href="{% url 'legal_download' slug=doc.slug fmt='html' %}">HTML</a></span>
  {% for o in others %}<a href="{{ o.url }}">{{ o.title }}</a>{% endfor %}
</div>
{% endif %}
<h1>{{ doc.title }}</h1>
<p class="date">Редакция от {{ doc.date }}</p>
{% for s in doc.sections %}<h2>{{ s.heading }}</h2>{% for p in s.paragraphs %}<p>{{ p }}</p>{% endfor %}{% endfor %}
</body></html>
